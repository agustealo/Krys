name: Normalize Krys namespace

on:
  push:
    branches:
      - 'fix/consumer-readiness-2026-09-21'
    paths:
      - '.github/workflows/namespace-krys.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/consumer-readiness-2026-09-21
          fetch-depth: 0

      - name: Normalize project namespace
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          replacements = (
              ('https://github.com/Zeus-Eternal/Krys', 'https://github.com/agustealo/Krys'),
              ('https://github.com/Zeus-Eternal', 'https://github.com/agustealo'),
              ('Zeus-Eternal/Krys', 'agustealo/Krys'),
              ('Zeus-Eternal', 'agustealo'),
              ('MARCIA', 'KRYS'),
              ('Marcia', 'Krys'),
              ('marcia', 'krys'),
          )

          excluded = {'.git'}
          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in excluded for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'Normalized namespace in {len(changed)} files')
          for item in changed:
              print(item)
          PY

          rm -f .github/workflows/namespace-krys.yml

          if grep -RInE 'Marcia|marcia|MARCIA|Zeus-Eternal' . --exclude-dir=.git; then
            echo 'Legacy namespace residue remains.' >&2
            exit 1
          fi

          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -print0)

          python3 - <<'PY'
          import json
          from pathlib import Path

          for candidate in [Path('theme.json'), Path('package.json'), *Path('styles').glob('*.json')]:
              if candidate.exists():
                  json.loads(candidate.read_text(encoding='utf-8'))
                  print(f'JSON OK: {candidate}')
          PY

          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'No namespace changes required.'
            exit 0
          fi

          git commit -m 'Normalize project namespace to Krys'
          git push origin HEAD:fix/consumer-readiness-2026-09-21
