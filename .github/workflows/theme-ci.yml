name: Theme CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static:
    name: Static / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate source contract
        run: php tools/validate-theme.php
      - name: PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  wordpress-smoke:
    name: WordPress 7.1.1 + WooCommerce smoke
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip
          tools: wp-cli
          coverage: none
      - name: Install WordPress 7.1.1
        env:
          WP_PATH: /tmp/wordpress
        run: |
          wp core download --version=7.1.1 --path="$WP_PATH" --force
          wp config create --path="$WP_PATH" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path="$WP_PATH" --url=http://127.0.0.1:8080 --title=Marcia --admin_user=admin --admin_password='consumer-readiness-ci' --admin_email=ci@example.invalid --skip-email
          mkdir -p "$WP_PATH/wp-content/themes/marcia"
          rsync -a --delete --exclude='.git' --exclude='dist' "$GITHUB_WORKSPACE/" "$WP_PATH/wp-content/themes/marcia/"
          wp theme activate marcia --path="$WP_PATH"
      - name: Prove clean theme boot
        env:
          WP_PATH: /tmp/wordpress
        run: |
          output="$(wp eval 'echo "SMOKE_OK";' --path="$WP_PATH" --skip-plugins)"
          test "$output" = "SMOKE_OK"
          wp eval 'if ( ! wp_is_block_theme() ) { throw new Exception( "Marcia is not loading as a block theme." ); }' --path="$WP_PATH" --skip-plugins
          wp eval '$patterns = WP_Block_Patterns_Registry::get_instance()->get_all_registered(); $found = false; foreach ( $patterns as $pattern ) { if ( isset( $pattern["name"] ) && str_starts_with( $pattern["name"], "marcia/" ) ) { $found = true; break; } } if ( ! $found ) { throw new Exception( "No Marcia patterns registered." ); }' --path="$WP_PATH" --skip-plugins
      - name: Prove WooCommerce integration
        env:
          WP_PATH: /tmp/wordpress
        run: |
          wp plugin install woocommerce --activate --path="$WP_PATH"
          wp eval 'if ( ! class_exists( "WooCommerce" ) ) { throw new Exception( "WooCommerce did not load." ); } if ( ! current_theme_supports( "woocommerce" ) ) { throw new Exception( "Theme support for WooCommerce is missing." ); }' --path="$WP_PATH"

  package:
    name: Release package
    needs: [static, wordpress-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none
      - name: Build validated ZIP
        run: php tools/build-release.php
      - uses: actions/upload-artifact@v4
        with:
          name: marcia-release-candidate
          path: dist/marcia-*.zip
          if-no-files-found: error
