name: Import Krys baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-krys.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import audited source tree
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REPO='https://github.com/Zeus-Eternal/Krys.git'
          SOURCE_SHA='29913b47faee3362061fb6cbffe5f51056df4ec1'

          git clone --no-tags "$SOURCE_REPO" /tmp/krys-source
          git -C /tmp/krys-source checkout --detach "$SOURCE_SHA"

          rsync -a --delete \
            --exclude='.git/' \
            /tmp/krys-source/ ./

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'No import changes detected.'
            exit 0
          fi

          git commit -m "Import Krys baseline from ${SOURCE_SHA}"
          git push origin HEAD:main
